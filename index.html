*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #f5b942;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}

function choiceButtons(l){return `<div class="choices">${l.options.map(x=>`<button class="choice" data-answer="${escapeHTML(x)}" onclick="choose(this)" aria-pressed="false">${pictureFor(x)}</button>`).join('')}</div>`}
function choose(b){selected=b.dataset.answer;document.querySelectorAll('[data-answer]').forEach(c=>{let on=c===b;c.classList.toggle('selected',on);c.setAttribute('aria-pressed',on?'true':'false')});resetFeedback()}
function pickProduct(id){if(shoppingSelected.includes(id))shoppingSelected=shoppingSelected.filter(x=>x!==id);else shoppingSelected.push(id);for(const p of products){const el=document.getElementById('prod-'+p.id);const yes=shoppingSelected.includes(p.id);el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',yes?'true':'false');el.querySelector('.picked').textContent=yes?'✓ Selezionato':' '}resetFeedback()}
function resetFeedback(){if(verified){verified=false;const f=document.getElementById('feedback');f.className='feedback';f.textContent=''}}
function checkAnswer(){if(!current)return;const l=current;let correct=false,answer='',hint='';if(l.type==='identity'){answer=JSON.stringify(identityData);correct=!!identityData.nome.trim()&&!!identityData.cognome.trim()&&!!identityData.occhi&&!!identityData.capelli;hint='SCRIVI ALMENO NOME E COGNOME.'}else if(l.type==='shopping'){const p=document.getElementById('price-pasta').value,m=document.getElementById('price-mele').value,t=document.getElementById('price-total').value;answer=`Prodotti: ${shoppingSelected.join(', ')||'nessuno'}; pasta: ${p||'-'}; mele: ${m||'-'}; totale: ${t||'-'}`;const matched=shoppingSelected.length===2&&shoppingSelected.includes(l.targets[0].toLowerCase())&&shoppingSelected.includes(l.targets[1].toLowerCase());const first=value(p)===products.find(x=>x.id===l.targets[0].toLowerCase()).price&&value(m)===products.find(x=>x.id===l.targets[1].toLowerCase()).price;correct=matched&&first&&value(t)===l.expectedTotal;hint=!matched?'Controlla i prodotti della lista: DEVI SCEGLIERE I PRODOTTI DELLA LISTA.':!first?'GUARDA I PREZZI DEI DUE PRODOTTI SUL VOLANTINO E COPIALI NELLA SCHEDA.':'Rifai la somma sulla calcolatrice e controlla il totale.'}else{answer=l.type==='text'?(document.getElementById('answerInput')?.value||''):selected||'';correct=clean(answer)===clean(l.expected);hint=l.type==='text'?'Rileggi la consegna e controlla le lettere.':'Riguarda la domanda e prova un’altra risposta.'}attempts++;const resultKey=l.id+'_'+activityIndex;const previous=saved.results[resultKey];saved.results[resultKey]={subject:l.subject,date:new Date().toISOString(),correct:correct||(previous?.correct&&saved.mode==='allenamento'),lastCorrect:correct,answer,attempts,mode:saved.mode,autonomy:previous?.autonomy||'Da osservare'};persist();verified=true;const f=document.getElementById('feedback');f.className='feedback visible '+(correct?'ok':'retry');if(saved.mode==='allenamento'){f.textContent=correct?'🌟 BRAVISSIMO, LUIGI! Hai completato l’attività!':'💛 BEL TENTATIVO! '+hint+' Puoi riprovare.'}else{f.textContent=correct?'✅ Risposta registrata. Bene!':'📝 Risposta registrata. Puoi riprovare, se previsto dal docente.'}if(correct){document.getElementById('status').textContent='✓ Attività completata. Puoi continuare con la prossima.'}}
function nextLesson(){if(!current)return;const id=current.id;const n=(variants[id]||[current]).length;if(activityIndex+1<n){activityIndex++;openLesson(id)}else{activityIndex=n-1;const area=document.getElementById('lessonBody');if(area){area.innerHTML='<div class="enh-visual" role="status"><h2>🎉 HAI COMPLETATO QUESTA MATERIA!</h2><p>PUOI RIPETERE GLI ESERCIZI O SCEGLIERE UN’ALTRA MATERIA.</p><div class="actions"><button class="btn" onclick="activityIndex=0;openLesson(\''+id+'\')">🔁 RIPETI LA MATERIA</button><button class="btn secondary" onclick="home()">📚 SCEGLI UNA MATERIA</button></div></div>';const next=document.querySelector('[onclick="nextLesson()"]');if(next)next.disabled=true;}}}
function showTeacher(){current=null;setCalculator(false);const rows=lessons.map(l=>{const r=saved.results[l.id+"_"+0];return `<tr><td>${l.icon} ${escapeHTML(l.subject)}</td><td>${r?escapeHTML(r.lastCorrect?'Corretta':r.correct?'Corretta in precedenza':'Da consolidare'):'Non svolta'}</td><td>${r?r.attempts:'—'}</td><td><select class="teacher-select" onchange="setAutonomy('${l.id}',this.value)" aria-label="Livello di autonomia in ${escapeHTML(l.subject)}">${['Da osservare','Autonomo','Aiuto verbale','Aiuto pratico'].map(o=>`<option ${r?.autonomy===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`}).join('');const done=Object.keys(saved.results).length;const ok=Object.values(saved.results).filter(r=>r.correct).length;app.innerHTML=`<div class="stage-head"><button class="back" onclick="home()">← Materie</button><h1>📋 Registro del docente</h1></div><section class="teacher"><h2>Riepilogo attività didattiche</h2><p>Questi risultati sono osservazioni di attività personalizzate, <strong>non voti automatici</strong>. La valutazione tiene conto del PEI e del giudizio dei docenti.</p><div class="summary"><div>Attività svolte<strong>${done}</strong></div><div>Attività corrette<strong>${ok}</strong></div><div>Attività disponibili<strong>${lessons.reduce((n,l)=>n+(variants[l.id]||[l]).length,0)}</strong></div></div><div style="overflow-x:auto"><table class="report-table"><thead><tr><th>Materia</th><th>Risultato</th><th>Tentativi ultima sessione</th><th>Autonomia / aiuti</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">I dati sono salvati solo in questo browser, su questo dispositivo. Non vengono inviati online. Per conservarli scarica il report.</p><div class="actions"><button class="btn" onclick="exportCSV()">⬇ Esporta report CSV</button><button class="btn secondary" onclick="window.print()">🖨 Stampa riepilogo</button><button class="btn secondary" onclick="resetWithConfirm()">Cancella risultati locali</button></div></section>`}
function setAutonomy(id,v){if(!saved.results[id])saved.results[id]={subject:lessons.find(l=>l.id===id)?.subject||id,date:new Date().toISOString(),correct:false,lastCorrect:false,answer:'',attempts:0,mode:saved.mode,autonomy:v};else saved.results[id].autonomy=v;persist()}
function exportCSV(){const cols=['Materia','Data','Esito ultimo tentativo','Risposta','Tentativi','Modalità','Autonomia'];const lines=[cols.join(';')];for(const l of lessons){const r=saved.results[l.id+"_"+0];const fields=[l.subject,r?.date||'',r?(r.lastCorrect?'Corretta':'Da consolidare'):'Non svolta',r?.answer||'',r?.attempts||'',r?.mode||'',r?.autonomy||''];lines.push(fields.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';'))}const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='resoconto_attivita_luigi_cusano.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetWithConfirm(){if(confirm('Vuoi cancellare tutti i risultati salvati in questo browser?')){saved.results={};persist();showTeacher()}}
function toggleCalculator(open){const el=document.getElementById('calcOverlay');const worksheet=document.querySelector('.worksheet');if(open&&worksheet&&el.parentElement!==worksheet){const button=worksheet.querySelector('.btn.gold');if(button)button.insertAdjacentElement('afterend',el);else worksheet.appendChild(el);}el.classList.toggle('open',open);if(open){calcExpr='';calcRender();el.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function calcRender(){document.getElementById('calcDisplay').textContent=calcExpr||'0'}
function calcPress(k){if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{if(!/^[\d+\-*/. ]{1,35}$/.test(calcExpr))throw Error('invalid');const n=Function('"use strict";return ('+calcExpr+')')();if(!Number.isFinite(n))throw Error('invalid');calcExpr=String(Math.round(n*100)/100)}catch{calcExpr='Errore'}}else{if(calcExpr==='Errore')calcExpr='';if(calcExpr.length<32)calcExpr+=k===','?'.':k}calcRender()}
const calculatorKeys=['7','8','9','÷','4','5','6','×','1','2','3','−','C','0',',','+','⌫','='];document.getElementById('calcKeys').innerHTML=calculatorKeys.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'equal':k==='C'||k==='⌫'?'clear':''}" onclick="calcPress('${k==='÷'?'/':k==='×'?'*':k==='−'?'-':k}')">${k}</button>`).join('');
document.addEventListener('keydown',e=>{const on=document.getElementById('calcOverlay').classList.contains('open');if(on&&e.key==='Escape'){toggleCalculator(false);return}if(!on)return;if(e.key==='Enter'){e.preventDefault();calcPress('=')}else if(e.key==='Backspace'){e.preventDefault();calcPress('⌫')}else if('0123456789.+-*/'.includes(e.key)&&e.key.length===1){e.preventDefault();calcPress(e.key)}});home();
</script>
